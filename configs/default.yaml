# Every number the pipeline uses lives here, so design decisions are visible
# in one place and nothing is hard-coded. See docs/decisions.md for the "why".

seed: 7

data:
  raw_dir: data/raw/aamos00          # where the AAMOS-00 CSVs go (not committed)
  out_dir: outputs                   # results, models, reports (not committed)

grid:
  minutes_per_day: 1440
  min_quality: 0.7                   # minutes below this are not used for baselines

labels:
  pef_moderate_pct: 80               # peak flow below 80% of personal best = moderate (action-plan yellow zone)
  inhaler_increase_factor: 2.0       # "increased" rescue use = more than 2x the usual daily puffs ...
  inhaler_increase_floor: 2          # ... and at least usual + 2 puffs
  usual_window_days: 14              # usual puffs = median of the previous 14 days
  default_onset_hour: 12             # onset hour when only day-level evidence exists
  merge_gap_days: 1                  # event days within 1 day of each other form one episode
  exclude_after_hours: 48            # baseline excludes the episode and 48 h after it

synthetic:
  # Histamine (sensor reads interstitial fluid). Plasma values from allergen
  # challenge: baseline ~0.22 ng/mL, early-response peak ~0.64 ng/mL at ~10 min.
  histamine:
    baseline_mean: 0.22
    baseline_sd: 0.08
    peak_mean: 0.64
    peak_sd: 0.30
    rise_min: 10                     # minutes from exposure to plasma peak
    decay_halflife_min: 15
    fluid_delay_min: 5               # plasma -> interstitial fluid delay (to be tuned)
    fluid_scale: 0.8                 # interstitial / plasma level ratio (to be tuned)
    noise_sd: 0.03
    circadian_amp: 0.03
  # S1P (sensor reads plasma). Relative changes are placeholders until set from
  # the challenge-study values; only early+late responders show the rise.
  s1p:
    baseline_mean: 1.0               # normalized units (fraction of personal baseline)
    baseline_sd: 0.15
    rise_pct_mean: 0.35              # early-response rise, as a fraction of baseline
    rise_pct_sd: 0.10
    rise_min: 45
    persist_hours: 8                 # stays elevated through the late response
    noise_sd: 0.03
    dual_responder_prob: 0.6         # share of users who get late responses
  exposure_lead_min: [5, 30]         # early response: exposure this many minutes before onset
  late_response_prob: 0.5            # dual responders: share of attacks that are LATE responses
  late_lead_hours: [3, 8]            # late response: exposure 3-8 h before onset (early reaction first)
  rr:
    day_mean: 16
    night_mean: 13
    sd: 1.5
    attack_rise: 6                   # breaths/min rise near onset
    activity_rise: 6
  wheeze:
    # wheeze is represented as the 0-1 score a separate audio classifier would output
    base: 0.05
    attack_peak: 0.7
    noise_sd: 0.05
  false_exposure_per_week: 1.0       # histamine blips with no attack (makes the task realistic)

baseline:
  window_days: 14
  blend_days: 14                     # personal weight grows from 0 to 1 over the first 14 days
  population:                        # population priors used before personal data exist
    hr: {day: [75, 12], night: [62, 9]}
    rr: {day: [16, 2], night: [13, 2]}
    histamine: {day: [0.18, 0.07], night: [0.17, 0.07]}
    s1p: {day: [1.0, 0.15], night: [1.0, 0.15]}
    wheeze: {day: [0.05, 0.05], night: [0.05, 0.05]}
  drift_z: 3.0                       # personal median further than this from population -> use population

features:
  signals: [hr, rr, wheeze, histamine, s1p]
  rate_spans_min:
    default: [15, 1440]
    histamine: [5, 15, 1440]
  variability_window_min: 60
  personal_threshold_z: 2.0
  population_high:                   # population "high" thresholds (backstop)
    hr: 100
    rr: 22
    wheeze: 0.5
    histamine: 0.5
    s1p: 1.4

targets:
  windows_min: [15, 60, 360]
  exclude_after_onset_min: 360       # minutes after onset not used as training examples
  quiet_subsample_every: 5           # keep every 5th minute far from attacks (speed)
  near_attack_min: 360               # keep every minute this close before an onset

model:
  n_estimators: 300
  learning_rate: 0.05
  num_leaves: 31
  min_child_samples: 50
  subsample: 0.8
  colsample_bytree: 0.8

alerts:
  user_threshold: null               # null = tune for the sensitivity target on training people
  sensitivity_target: 0.90
  ems_threshold: 0.5                 # applied to P(severe)
  cooldown_min: 30
  countdown_s: 45
  false_alarm_budgets: [1, 3]   # alerts/day used to trace the sensitivity trade-off
